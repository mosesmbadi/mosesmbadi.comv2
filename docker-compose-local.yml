services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: calcom
      POSTGRES_DB: calcom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom"]
      interval: 5s
      timeout: 5s
      retries: 10

  calcom-migrate:
    image: calcom/cal.com:latest
    env_file:
      - cal.env
    command: sh -c "cd /calcom && npx prisma migrate deploy"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  calcom:
    image: calcom/cal.com:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - cal.env
    depends_on:
      postgres:
        condition: service_healthy
      calcom-migrate:
        condition: service_completed_successfully

  api:
    build: ./api
    ports:
      - "3009:3009"
    volumes:
      - ./api:/api
      - api_node_modules:/api/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "5174:5173"
    environment:
      VITE_CAL_ORIGIN: http://localhost:3000
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules

volumes:
  frontend_node_modules:
  api_node_modules:
  postgres_data:
